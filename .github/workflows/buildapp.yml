name: Build NexPanel APK

on:
  workflow_dispatch:

jobs:
  build-nexapp:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Flutter 3.22.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Project Files dari nexapp/
        run: |
          echo "=== Isi nexapp/ ==="
          ls -la nexapp/ || { echo "ERROR: folder nexapp/ tidak ada!"; exit 1; }
          echo "=== Copy files ke root ==="
          for item in nexapp/*; do
            n=$(basename "$item")
            if [ "$n" != ".github" ]; then
              cp -rf "$item" . 2>/dev/null || true
              echo "  Copied: $n"
            fi
          done
          echo "=== Root setelah copy ==="
          ls -la
          echo "=== Cek pubspec.yaml ==="
          [ -f pubspec.yaml ] && echo "OK: pubspec.yaml ada" || { echo "ERROR: pubspec.yaml tidak ada!"; exit 1; }
          echo "=== Cek android/ ==="
          [ -d android ] && echo "OK: android/ ada" || { echo "ERROR: android/ tidak ada!"; exit 1; }

      - name: Fix local.properties
        run: |
          FLUTTER_SDK=$(dirname $(dirname $(which flutter)))
          echo "sdk.dir=$ANDROID_SDK_ROOT"  > android/local.properties
          echo "flutter.sdk=$FLUTTER_SDK"  >> android/local.properties
          echo "=== local.properties ==="
          cat android/local.properties

      - name: Fix Gradle Wrapper Permission & JAR
        run: |
          chmod +x android/gradlew 2>/dev/null || true
          mkdir -p android/gradle/wrapper
          JAR="android/gradle/wrapper/gradle-wrapper.jar"
          if [ ! -f "$JAR" ] || [ ! -s "$JAR" ]; then
            echo "Download gradle-wrapper.jar..."
            curl -fsSL -o "$JAR" \
              "https://github.com/gradle/gradle/raw/v8.4.0/gradle/wrapper/gradle-wrapper.jar"
            echo "Downloaded: $(du -sh $JAR)"
          else
            echo "gradle-wrapper.jar OK: $(du -sh $JAR)"
          fi

      - name: Accept Android Licenses
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Flutter pub get
        run: |
          flutter pub get
          echo "✅ pub get selesai"

      - name: Read App Name dari strings.xml
        run: |
          STRINGS="android/app/src/main/res/values/strings.xml"
          if [ -f "$STRINGS" ]; then
            APP_NAME=$(grep -oP '(?<=<string name="app_name">)[^<]+' "$STRINGS" | head -1 || echo "")
          fi
          [ -z "$APP_NAME" ] && APP_NAME="NEX_PANEL"
          echo "App name: $APP_NAME"
          SAFE=$(echo "$APP_NAME" | sed 's/[^a-zA-Z0-9_-]/_/g' | sed 's/__*/_/g')
          echo "APK_SAFE=$SAFE" >> $GITHUB_ENV
          echo "App name safe: $SAFE"

      - name: Enable R8 + shrinkResources di build.gradle
        run: |
          GRADLE="android/app/build.gradle"
          if [ -f "$GRADLE" ]; then
            sed -i 's/minifyEnabled false/minifyEnabled true/g'    "$GRADLE"
            sed -i 's/shrinkResources false/shrinkResources true/g' "$GRADLE"
            echo "=== buildTypes setelah patch ==="
            grep -A5 "buildTypes" "$GRADLE" || true
          else
            echo "WARNING: build.gradle tidak ditemukan, skip patch"
          fi

      - name: Build Release APK (size optimized)
        run: |
          flutter build apk \
            --release \
            --target-platform android-arm,android-arm64 \
            --split-per-abi \
            --obfuscate \
            --split-debug-info=build/debug-info/ \
            --no-tree-shake-icons
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}

      - name: Pilih & Verifikasi APK
        run: |
          echo "=== APK yang dihasilkan ==="
          find build/app/outputs/apk/release -name "*.apk" 2>/dev/null || echo "Tidak ada APK di path default"
          find . -name "*.apk" -not -path "./.git/*" 2>/dev/null | head -10

          # Pilih arm64 dulu, fallback ke apk manapun
          APK=$(find build/app/outputs/apk/release -name "*arm64*.apk" 2>/dev/null | head -1)
          [ -z "$APK" ] && APK=$(find build/app/outputs/apk/release -name "*release*.apk" 2>/dev/null | head -1)
          [ -z "$APK" ] && APK=$(find build/app/outputs/apk/release -name "*.apk" 2>/dev/null | head -1)
          [ -z "$APK" ] && APK=$(find . -name "*.apk" -not -path "./.git/*" 2>/dev/null | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak ditemukan setelah build!"
            exit 1
          fi

          echo "✅ APK dipilih: $APK"
          echo "   Ukuran: $(du -sh "$APK" | cut -f1)"
          echo "APK_PATH=$APK" >> $GITHUB_ENV

      - name: Sign APK
        run: |
          # Generate keystore
          keytool -genkey -v \
            -keystore sign.keystore \
            -alias key0 \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android123 \
            -keypass android123 \
            -dname "CN=KenzMD,O=NexPanel,C=MY" \
            -noprompt 2>/dev/null || true

          # Cari apksigner
          BUILD_TOOLS_VER=$(ls $ANDROID_SDK_ROOT/build-tools | sort -V | tail -1)
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS_VER/apksigner"
          echo "apksigner: $APKSIGNER"

          OUTNAME="${{ env.APK_SAFE }}.apk"

          $APKSIGNER sign \
            --ks sign.keystore \
            --ks-key-alias key0 \
            --ks-pass pass:android123 \
            --key-pass pass:android123 \
            --out "$OUTNAME" \
            "${{ env.APK_PATH }}"

          echo "✅ APK signed: $OUTNAME ($(du -sh $OUTNAME | cut -f1))"
          echo "FINAL_APK=$OUTNAME" >> $GITHUB_ENV

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexapp-apk-output
          path: ${{ env.FINAL_APK }}
          retention-days: 3

      - name: Ringkasan Build
        if: success()
        run: |
          echo "========================================"
          echo "✅ BUILD NEXPANEL APK BERHASIL!"
          echo "========================================"
          echo "App    : ${{ env.APK_SAFE }}"
          echo "APK    : ${{ env.FINAL_APK }}"
          echo "Ukuran : $(du -sh ${{ env.FINAL_APK }} | cut -f1)"
          echo "========================================"
