name: Build Web2APK

on:
  workflow_dispatch:
    inputs:
      website_url:
        description: 'URL Website'
        required: true
        type: string
      app_name:
        description: 'Nama Aplikasi'
        required: true
        type: string
      icon_base64:
        description: 'Icon Base64'
        required: true
        type: string

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 🔧 Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick

      - name: 🖼️ Process Icon
        run: |
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          echo "${{ github.event.inputs.icon_base64 }}" | base64 -d > icon_raw.png
          convert icon_raw.png -resize 48x48   android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert icon_raw.png -resize 72x72   android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert icon_raw.png -resize 96x96   android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert icon_raw.png -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert icon_raw.png -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: 📝 Inject App Name & URL
        run: |
          cat > android/app/src/main/res/values/strings.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">${{ github.event.inputs.app_name }}</string>
              <string name="website_url">${{ github.event.inputs.website_url }}</string>
          </resources>
          EOF

      - name: ⚙️ Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}

      - name: 🔏 Sign APK
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          keytool -genkey -v -keystore debug.keystore -alias key0 \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=KenzMD,O=Web2APK,C=MY" -noprompt 2>/dev/null || true
          BTOOL=$ANDROID_SDK_ROOT/build-tools/$(ls $ANDROID_SDK_ROOT/build-tools | sort -V | tail -1)/apksigner
          $BTOOL sign --ks debug.keystore --ks-key-alias key0 \
            --ks-pass pass:android --key-pass pass:android \
            --out output.apk "$APK"

      - name: 📦 Rename & Upload APK
        run: |
          SAFE=$(echo "${{ github.event.inputs.app_name }}" | sed 's/ /_/g' | tr -dc '[:alnum:]_-')
          mv output.apk "${SAFE}.apk"
          echo "APK_FILE=${SAFE}.apk" >> $GITHUB_ENV

      - name: 📤 Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-output
          path: ${{ env.APK_FILE }}
          retention-days: 3
