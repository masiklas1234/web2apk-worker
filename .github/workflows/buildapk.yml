name: Build Genetic APK

on:
  workflow_dispatch:

jobs:
  build-genetic:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android Licenses
        run: yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pillow
        run: pip install Pillow --quiet

      - name: Verify Genetic Files
        run: |
          ls -la genetic/ || { echo "ERROR: folder genetic tidak ada"; exit 1; }

      - name: Setup Project Structure
        run: |
          for item in genetic/*; do
            n=$(basename "$item")
            [ "$n" != ".github" ] && cp -rf "$item" . 2>/dev/null || true
          done
          echo "Files copied OK"
          ls -la

      - name: Read App Name from strings.xml
        run: |
          # Baca nama APK langsung dari strings.xml dalam ZIP
          APP_NAME=$(grep -oP '(?<=<string name="app_name">)[^<]+' android/app/src/main/res/values/strings.xml || echo "GeneticAPK")
          echo "App name dari strings.xml: $APP_NAME"
          echo "APP_NAME=$APP_NAME" >> $GITHUB_ENV
          # Safe filename untuk APK
          SAFE=$(echo "$APP_NAME" | sed 's/[^a-zA-Z0-9_-]/_/g')
          echo "APK_SAFE=$SAFE" >> $GITHUB_ENV
          echo "APK safe name: $SAFE"

      - name: Fix local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Download Gradle Wrapper JAR
        run: |
          mkdir -p android/gradle/wrapper
          JAR="android/gradle/wrapper/gradle-wrapper.jar"
          if [ ! -f "$JAR" ] || [ ! -s "$JAR" ]; then
            curl -fsSL -o "$JAR" \
              "https://github.com/gradle/gradle/raw/v8.4.0/gradle/wrapper/gradle-wrapper.jar"
            echo "Downloaded: $(du -sh $JAR)"
          fi
          chmod +x android/gradlew

      - name: Generate Icons dari sync.jpg
        run: |
          python3 generate_icons.py
          echo "Icons generated OK"

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx2g -XX:MaxMetaspaceSize=512m" \
            -Dkotlin.incremental=false
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Sign and Rename APK
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          [ -z "$APK" ] && { echo "APK not found!"; find android -name "*.apk" 2>/dev/null; exit 1; }
          echo "APK: $APK ($(du -sh $APK | cut -f1))"
          keytool -genkey -v -keystore sign.keystore -alias key0 \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android123 -keypass android123 \
            -dname "CN=KenzMD,O=Web2APK,C=MY" -noprompt 2>/dev/null || true
          BTOOL=$ANDROID_SDK_ROOT/build-tools/$(ls $ANDROID_SDK_ROOT/build-tools | sort -V | tail -1)/apksigner
          OUTNAME="${{APK_SAFE}}.apk"
          $BTOOL sign --ks sign.keystore --ks-key-alias key0 \
            --ks-pass pass:android123 --key-pass pass:android123 \
            --out "$OUTNAME" "$APK"
          echo "FINAL_APK=$OUTNAME" >> $GITHUB_ENV
          echo "Signed: $OUTNAME ($(du -sh $OUTNAME | cut -f1))"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: genetic-apk-output
          path: ${{ env.FINAL_APK }}
          retention-days: 3