name: Build Genetic APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Nama APK'
        required: true
        default: 'GeneticAPK'
        type: string

jobs:
  build-genetic:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pillow
        run: pip install Pillow --quiet

      - name: Verify Genetic Files
        run: |
          echo "=== Contents of genetic/ ==="
          ls -la genetic/ || { echo "ERROR: Folder genetic/ tidak ada!"; exit 1; }

      - name: Setup Project Structure
        run: |
          shopt -s dotglob
          for item in genetic/*; do
            name=$(basename "$item")
            if [ "$name" != ".github" ] && [ "$name" != "app_icon.png" ]; then
              cp -rf "$item" . 2>/dev/null || true
            fi
          done
          echo "Project files copied OK"
          ls -la

      - name: Fix local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          echo "Fixed: sdk.dir=$ANDROID_SDK_ROOT"

      - name: Download Gradle Wrapper JAR
        run: |
          mkdir -p android/gradle/wrapper
          JAR="android/gradle/wrapper/gradle-wrapper.jar"
          if [ ! -f "$JAR" ]; then
            curl -fsSL -o "$JAR" \
              "https://github.com/gradle/gradle/raw/v8.4.0/gradle/wrapper/gradle-wrapper.jar"
            echo "Downloaded: $(du -sh $JAR)"
          fi
          chmod +x android/gradlew

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android Licenses
        run: yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Generate Icons from Uploaded Icon
        run: |
          ICON_SRC="genetic/app_icon.png"
          if [ -f "$ICON_SRC" ]; then
            python3 generate_icons.py "$ICON_SRC" 2>/dev/null || python3 generate_icons.py
          else
            python3 generate_icons.py
          fi
          echo "Icons generated OK"

      - name: Inject App Name into strings.xml
        run: |
          APP="${{ github.event.inputs.app_name }}"
          echo "App name: $APP"
          # Update strings.xml dengan nama APK dari input
          sed -i "s|<string name=\"app_name\">.*</string>|<string name=\"app_name\">$APP</string>|g" \
            android/app/src/main/res/values/strings.xml || true
          # Juga update package name friendly
          echo "strings.xml updated"

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx2g -XX:MaxMetaspaceSize=512m"
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Sign and Rename APK
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          [ -z "$APK" ] && { echo "ERROR: APK tidak ditemukan"; exit 1; }
          echo "APK: $APK ($(du -sh $APK | cut -f1))"
          keytool -genkey -v -keystore sign.keystore -alias key0 \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android123 -keypass android123 \
            -dname "CN=KenzMD,O=Web2APK,C=MY" -noprompt 2>/dev/null || true
          BTOOL=$ANDROID_SDK_ROOT/build-tools/$(ls $ANDROID_SDK_ROOT/build-tools | sort -V | tail -1)/apksigner
          SAFE=$(echo "${{ github.event.inputs.app_name }}" | sed 's/[^a-zA-Z0-9_-]/_/g')
          $BTOOL sign --ks sign.keystore --ks-key-alias key0 \
            --ks-pass pass:android123 --key-pass pass:android123 \
            --out "${SAFE}.apk" "$APK"
          echo "APK_FILE=${SAFE}.apk" >> $GITHUB_ENV
          echo "Signed: ${SAFE}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: genetic-apk-output
          path: ${{ env.APK_FILE }}
          retention-days: 3